[package]
name = "ignis-core"
description = "ignis: scheduler, paged KV, GDN state, request state machine, model topology config"
version.workspace = true
edition.workspace = true

[dependencies]
ignis-artifact = { path = "../artifact" }

[features]
# Forwards to the artifact crate's `cuda` feature (the VRAM materialization
# path, ADR 0002). ignis-core itself has no CUDA-coupled code since GitHub
# #39 deleted the superseded compute adapter; this flag exists so
# `ignis-server`'s `cuda` feature can still reach `ignis-artifact/cuda`.
cuda = ["ignis-artifact/cuda"]