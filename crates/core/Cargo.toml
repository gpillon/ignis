[package]
name = "ignis-core"
description = "ignis: scheduler, paged KV, GDN state, request state machine, model topology config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignis-artifact = { path = "../artifact" }
# Request-lifecycle span tree (GitHub #81, ADR 0012): admission / prefill /
# decode-round / completion spans, all keyed by `request_id`. No call site
# here decides how spans are rendered or where they go — that stays
# `ignis-logging`'s job (this crate has no dependency on it).
tracing = { workspace = true }
# `locate`'s template fold (GitHub #278): the reference's patterns
# (`tools/locate-sets/compress.py`), with Python's leftmost-first semantics.
# Already in the lock through `tracing-subscriber`.
regex = "1"
# The Flash-Next artifact's sidecar (`<artifact>.conversion.json`, GitHub
# #302): the converter's calibration expert traffic the residency's pools
# are split by. Already a dependency of ignis-artifact.
serde_json = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# Fixture integrity only (crates/core/tests/hq_kv_fixture_*): hashing the
# committed hq-e8-2b KV row fixture, never a production dependency (same
# version crates/bench already pins for its own oracle/trace hashing).
sha2 = "0.10"

[features]
# Forwards to the artifact crate's `cuda` feature (the VRAM materialization
# path, ADR 0002) and gates this crate's own `model_load` (the step ABI's
# model-load call, GitHub #53 / ADR 0009) and `seq` (the sequence handle
# step ABI, GitHub #55) modules so `ignis-server`'s `cuda` feature reaches
# both.
cuda = ["ignis-artifact/cuda"]
# Test-only diagnostic seam for the P4-03 (GitHub #119) hq-e8-2b fixture
# capture: gates `seq::ffi`'s two `ignis_kv_capture_*` declarations and
# `Seq::capture_kv_rows_for_test` (kernel/include/ignis_kv_capture.h is
# NOT part of the public flat C ABI, ADR 0009). Exists solely so
# `crates/core/tests/hq_kv_fixture_capture_gpu.rs` can re-capture
# `kernel/tests/fixtures/hq_kv_rows_27b.bin` if the artifact or the capture
# prompt ever changes -- never enabled in a production build (no
# production Cargo.toml in this workspace turns it on).
kv-capture = []
# Test-only attention-input tap (kernel/include/ignis_attn_tap.h, not part of
# the public flat C ABI): gates `attn_tap`, which arms a process-wide capture
# of the rotated query and key rows a GQA layer hands its attention op, so a
# GPU test can score one head's attention onto the image tokens on the host
# (docs/findings/2026-09-21-one-attention-head-points.md). Never enabled in a
# production build; the only production-side trace is the disarmed flag
# check in `run_gqa_layer`.
attn-tap = []
# Test-only Flash-Next residual-stack tap (kernel/include/ignis_fn_residual_tap.h,
# not part of the public flat C ABI): gates `residual_tap` and
# `FlashNextEngine::tapped_span`, which copy the trunk's final pre-mixer stack
# of every prefill position to the host, so spec flash-next/07 phase A can feed
# the checkpoint's MTP head the engine's own states. Never enabled in a
# production build; the only production-side trace is the disarmed flag check
# in the Flash-Next prefill.
residual-tap = []
# The KLD measurement's engine side (2026-09-24): every position's logits
# for a set of token windows, via `step::prefill_program_span_logits`.
[[example]]
name = "span_logits"
required-features = ["cuda"]
# Spec flash-next/07 phase A's engine side: the tapped trunk states the MTP
# prototype reads, and the decode round's cost per row.
[[example]]
name = "flash_next_mtp_phase_a"
required-features = ["cuda", "residual-tap"]
# Spec flash-next/07 phase B: the tapped trunk states over the calibration
# corpus that the MTP head's expert Hessians are computed from.
[[example]]
name = "flash_next_mtp_calibration"
required-features = ["cuda", "residual-tap"]
