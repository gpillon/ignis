# The built-in catalog (ADR 0047, spec model-download/02): the owner's
# releases, compiled into the binary with `include_str!` and parsed by the
# same code as an operator's catalog. Its pins are the trust anchor ADR 0033
# made them: nothing outside the binary can change them.
#
# Every value is the Hugging Face API's at the pinned revision: a large
# file's sha256 is its LFS oid, a sidecar's was computed from the file served
# at that revision. Files are listed small first. Adding one of the owner's
# models is an entry here and a new binary.
#
# `card_class` is the smallest card class an entry loads on, in GB (16, 24,
# 32 or 96; ADR 0064): a switch, a request, a start or a download naming an
# entry above the card's class is refused before anything is torn down or
# fetched. `generation` (optional; ADR 0079) is the oldest GPU generation an
# entry loads on, `ampere`, `ada` or `blackwell`, refused the same way on an
# older card; an entry stating none loads on every generation the build runs
# on. An NVFP4 artifact, Flash-Next and the image model state `blackwell`,
# and so does a trellis build until it is verified below it. `aliases`
# (optional) lists the ids an entry also answers to: its family's default id,
# or another entry's served id of its family, served by it on a card that
# cannot load that id's own entry — how the 16 GB 27B answers to
# `qwen3.8-27b` on a 16 GB card, and on an RTX 3090. `family` (optional) is
# the model family an entry is of, by the family's own id (ADR 0074): stated
# where an alias involves an entry and neither its id nor its aliases is a
# family's own id.
# `license` (required here, ADR 0078) is the license the entry's weights are
# published under: `id` as the entry's Hugging Face card names it at the
# pinned revision, `url` the license file in the entry's repo at that
# revision when it holds one, else the license's canonical text.
