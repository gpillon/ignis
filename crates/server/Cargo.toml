[package]
name = "ignis-server"
description = "ignis: OpenAI-compatible HTTP server entrypoint"
version.workspace = true
edition.workspace = true

[dependencies]
ignis-core = { path = "../core" }
ignis-artifact = { path = "../artifact" }
ignis-runtime = { path = "../runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
futures-core = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }

[features]
# Forwards to the artifact crate's VRAM materialization path (ADR 0002) and
# to `ignis-runtime`'s production `CudaLeaf` (GitHub #61 / P1-25): with
# `IGNIS_ARTIFACT` set and this feature on, the entrypoint drives the real
# GPU-backed model instead of the deterministic `MockCompute` (ADR 0006);
# off, or without an artifact, it stays on `MockCompute` (CPU-only).
cuda = ["ignis-core/cuda", "ignis-artifact/cuda", "ignis-runtime/cuda"]
