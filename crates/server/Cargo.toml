[package]
name = "ignis-server"
description = "ignis: OpenAI-compatible HTTP server entrypoint"
version.workspace = true
edition.workspace = true

[dependencies]
ignis-core = { path = "../core" }
ignis-artifact = { path = "../artifact" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
futures-core = { workspace = true }

[dev-dependencies]
tower = { workspace = true }

[features]
# Forwards to `ignis-core`'s `cuda` feature (which forwards to the artifact
# crate's VRAM materialization path, ADR 0002). The entrypoint always drives
# the deterministic `MockCompute` (ADR 0006, CPU-only) — the production
# compute adapter is not landed yet (GitHub #39 / P1-24, #60).
cuda = ["ignis-core/cuda"]