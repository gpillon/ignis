[package]
name = "ignis-server"
description = "ignis: OpenAI-compatible HTTP server entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignis-core = { path = "../core" }
ignis-artifact = { path = "../artifact" }
ignis-runtime = { path = "../runtime" }
ignis-logging = { path = "../logging" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
futures-core = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true }
getrandom = { workspace = true }
cloudflare-quick-tunnel = { workspace = true }
# Media acquisition (GitHub #179): HTTP(S) image URLs, fetched with the
# connection pinned to the address the SSRF check resolved, no proxy, no
# automatic redirects (`media.rs`). Already in the tree through the tunnel
# crate, with the same rustls backend.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The media cache's key: the SHA-256 of the acquired bytes, computed before
# the lookup so a hit skips decode, resize and packing.
sha2 = "0.10"

[dev-dependencies]
# Encodes the flat test images the media tests send (`tests/support/media.rs`).
png = "0.18"
tower = { workspace = true }
http-body-util = { workspace = true }
tracing-subscriber = { workspace = true }
# The G1 canary gate (ADR 0014, GitHub #76): the teacher-forced agreement
# scoring + the >= 95% floor live in `ignis_bench::oracle` so the arithmetic
# is CPU-unit-tested there, while the GPU driver that produces the
# predictions lives here (`tests/oracle_teacher_forced_gpu.rs`) -- it needs
# the step ABI, which `ignis-bench` does not depend on. Dev-only, so no
# production dependency edge is created.
ignis-bench = { path = "../bench" }

[features]
# Forwards to the artifact crate's VRAM materialization path (ADR 0002) and
# to `ignis-runtime`'s production `CudaLeaf` (GitHub #61 / P1-25): with
# `IGNIS_ARTIFACT` set and this feature on, the entrypoint drives the real
# GPU-backed model instead of the deterministic `MockCompute` (ADR 0006);
# off, or without an artifact, it stays on `MockCompute` (CPU-only).
cuda = ["ignis-core/cuda", "ignis-artifact/cuda", "ignis-runtime/cuda"]
# Test-only: forwards `ignis-core`'s attention-input tap for
# `tests/attention_head_point_gpu.rs`. Never enabled in a production build.
attn-tap = ["ignis-core/attn-tap"]
