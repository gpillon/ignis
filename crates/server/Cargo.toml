[package]
name = "ignis-server"
description = "ignis: OpenAI-compatible HTTP server entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignis-core = { path = "../core" }
ignis-artifact = { path = "../artifact" }
ignis-runtime = { path = "../runtime" }
# Structured output's grammar (GitHub #587, ADR 0089): a request's
# `response_format` compiled against the loaded tokenizer's vocabulary.
ignis-grammar = { path = "../grammar" }
ignis-logging = { path = "../logging" }
# The speech model's CPU executor (spec speech/01, ADR 0068): pure Rust, in every build.
ignis-speech = { path = "../speech" }
serde = { workspace = true }
# `raw_value` (GitHub #588): a `json_schema` reaches the grammar as the text
# the client sent, its keys in their order; `serde_json::Value`'s map sorts
# them, and a strict answer writes its keys in the schema's order.
serde_json = { workspace = true, features = ["raw_value"] }
# The config file's YAML half (ADR 0046, spec config-v2/01): read and written
# through the same `serde` path as its JSON half. 0.9 is the last release and
# marked deprecated upstream; it is complete for a config file's needs and
# pulls in nothing but `unsafe-libyaml`, `indexmap`, `itoa` and `ryu`.
serde_yaml = "0.9"
# `ws`: the Responses API's WebSocket mode (GitHub #282), `tokio-tungstenite`
# 0.29 underneath; a probe on 2026-09-29 found it adds no host `windows-sys`.
# `multipart`: `POST /v1/images/edits`' form (spec image-model/05), `multer`
# underneath.
axum = { workspace = true, features = ["ws", "multipart"] }
# The body trait itself (axum re-exports it, not its `Frame`): a response
# body that holds its request's in-flight count until it ends, for idle
# unload (spec model-switch/02, `idle.rs`). Already in the tree under axum.
http-body = "1"
# `Limited`: the request body cap, read per request off the model serving then
# (`api::limit_request_body`, #563). Already in the tree under axum.
http-body-util = { workspace = true }
tokio = { workspace = true }
futures-core = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true }
getrandom = { workspace = true }
cloudflare-quick-tunnel = { workspace = true }
# Media acquisition (GitHub #179): HTTP(S) image URLs, fetched with the
# connection pinned to the address the SSRF check resolved, no proxy, no
# automatic redirects (`media.rs`). Already in the tree through the tunnel
# crate, with the same rustls backend.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The media cache's key: the SHA-256 of the acquired bytes, computed before
# the lookup so a hit skips decode, resize and packing.
sha2 = "0.10"
# The loop guard's repetition score (`loop_guard.rs`): the zlib ratio of a
# window of reasoning. Already in the tree under `flate2`.
miniz_oxide = "0.9"
# The image routes' output (spec image-model/05): RGBA 8-bit PNG, the
# version `ignis-artifact` decodes with.
png = "0.18"
# The transcription route's decoder (spec speech/02, GitHub #352): WAV, FLAC,
# MP3 and AAC, the Ogg and Matroska/WebM containers demuxed. Pure Rust, no
# native code, no codec beyond these (no Vorbis, no Opus: libopus is a
# separate decision, spec speech/spec.md "Native code outside `cuda`").
# MPL-2.0, a dependency and not copied code (ADR 0051).
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "aac", "isomp4", "ogg", "mkv"] }

# `_exit` (GitHub #329, `shutdown::exit_now`): a stop before serving ends the
# process without running its exit handlers. Already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# An entry's lock (GitHub #379, `download/lock.rs`): `LockFileEx` on one byte
# of the lock file past the holder's note, so a refused fetch reads who holds
# it; std's `File::try_lock` locks the whole file on Windows. The workspace's
# version and features, already in the target graph through `ignis-artifact`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# The scripted speech executor the integration tests drive (`fake-speech`,
# below): this crate again, with the feature on, so a shipped build has none.
ignis-server = { path = ".", features = ["fake-speech"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
# The G1 canary gate (ADR 0014, GitHub #76): the teacher-forced agreement
# scoring + the >= 95% floor live in `ignis_bench::oracle` so the arithmetic
# is CPU-unit-tested there, while the GPU driver that produces the
# predictions lives here (`tests/oracle_teacher_forced_gpu.rs`) -- it needs
# the step ABI, which `ignis-bench` does not depend on. Dev-only, so no
# production dependency edge is created.
ignis-bench = { path = "../bench" }
# The Responses WebSocket tests' client (GitHub #282): the same 0.29 axum's
# `ws` feature serves, and `futures-util` for its `Sink`/`Stream` halves.
tokio-tungstenite = "0.29"
futures-util = "0.3"

[features]
# Forwards to the artifact crate's VRAM materialization path (ADR 0002) and
# to `ignis-runtime`'s production `CudaLeaf` (GitHub #61 / P1-25): with
# `IGNIS_MODEL_ARTIFACT` set and this feature on, the entrypoint drives the real
# GPU-backed model instead of the deterministic `MockCompute` (ADR 0006);
# off, or without an artifact, it stays on `MockCompute` (CPU-only).
cuda = ["ignis-core/cuda", "ignis-artifact/cuda", "ignis-runtime/cuda"]
# Test-only: forwards `ignis-core`'s attention-input tap for
# `tests/attention_head_point_gpu.rs`. Never enabled in a production build.
attn-tap = ["ignis-core/attn-tap"]
# Test-only: `speech::executor::FakeExecutor`, the scripted speech executor
# the route, the worker and the Realtime tests run against. The integration
# tests turn it on through the dev-dependency above; never in a shipped build.
fake-speech = []
