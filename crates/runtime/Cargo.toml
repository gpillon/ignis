[package]
name = "ignis-runtime"
description = "ignis: safe step-ABI runtime and scheduler compute adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignis-core = { path = "../core" }
ignis-artifact = { path = "../artifact" }
tracing = { workspace = true }
# KV-disk (spec vram-budget/03, ADR 0045): a CRC32 per window and per header,
# which keeps pace with a 3 GB/s read where SHA-256 would not. Already in the
# lock through `png`/`flate2`.
crc32fast = "1.5"

[dev-dependencies]
# Only for `cuda_leaf.rs`'s `leaf_error` unit test (GitHub #80): asserts the
# `tracing::error!` call's shape, same pure/no-GPU-needed style as this
# module's other tests below it.
ignis-logging = { path = "../logging" }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[features]
# The safe wrapper itself is leaf-agnostic; this forwards the production
# build's link requirements to the existing CUDA-gated core ABI modules.
# `ignis-artifact/cuda` is needed directly (not only through `ignis-core`):
# the production `CudaLeaf` (`src/cuda_leaf.rs`) owns the materialized
# artifact + device context its model load reads from.
cuda = ["ignis-core/cuda", "ignis-artifact/cuda"]

# The DFlash2 acceptance replay of recorded agent turns (GitHub #267, #340):
# teacher-forced verify rounds, with the drafter's proposals and the target's
# logits read per round, on a 27B load planned as the server plans it.
[[example]]
name = "dflash2_replay"
required-features = ["cuda"]
# The same replay under the 27B's MTP head (GitHub #626): teacher-forced verify
# rounds, with the head's chain, its probability of each draft and its leading
# candidates read per round.
[[example]]
name = "mtp_replay"
required-features = ["cuda"]
# The verify round's width-cost curve (GitHub #267): round time at draft
# windows 1..7 and at plain decode, at the load's lanes.
[[example]]
name = "verify_width_cost"
required-features = ["cuda"]
