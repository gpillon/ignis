[package]
name = "ignis-artifact"
description = "ignis: .ninfer container reader (v2 framing, closed JSON directory, mmap + direct I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ignis-artifact-inspect"
path = "src/bin/inspect.rs"

# The `cuda` feature links the kernel leaf's flat C device surface
# (`kernel/include/ignis_device.h`) and enables the `CudaDevice` backend.
# Off by default: the CPU mock (`CpuDevice`) is always available (ADR 0006,
# the RTX 5090 is held by the reference runner).
[features]
cuda = []

[dependencies]
memmap2 = { workspace = true }
serde_json = { workspace = true }

# The frontend extraction (artifact-02) parses the container-carried
# `frontend/tokenizer.json` (the HuggingFace `tokenizers` format) and
# renders `frontend/chat_template.jinja` (a Jinja template). Both are
# pure-Rust, CPU-only, and idiomatic for their formats.
tokenizers = "0.21"
# The `json` feature (not a minijinja default) brings serde_json into
# minijinja; the chat template's `tojson` itself is the reference's
# (`frontend.rs` `reference_tojson`, GitHub #172). `preserve_order` makes
# minijinja's own map an `IndexMap`, so a value deserialized from a JSON
# document keeps that document's key order — what a resent tool call's
# `arguments` needs to render in the order the model emitted (GitHub
# #184). It changes nothing for values that arrive as `serde_json::Value`:
# its `Map` is a `BTreeMap`, so those are already sorted when minijinja
# receives them (the tool definitions, which the reference also sorts).
minijinja = { version = "2", features = ["json", "preserve_order"] }
# The vision processor (GitHub #176): the SHA-256 content digest of acquired
# media, and pure-Rust decoders for the lossless image formats (PNG, GIF,
# lossless WebP), whose pixels are exactly what the reference's FFmpeg
# decoders produce. JPEG goes through the processor's own port of the
# reference's FFmpeg path (`vision/jpeg.rs`).
sha2 = "0.10"
png = "0.18"
gif = "0.14"
image-webp = "0.2"

[dev-dependencies]
# GitHub #135: `tests/layer_reference_real.rs` is a CPU-only oracle, but it
# still runs under the explicit profile and so must decide a missing
# artifact through `ignis_core::gpu_profile` rather than a self-skip
# (docs/agents/testing.md). A dev-dependency back onto `ignis-core` (which
# depends on this crate) is the one cycle Cargo allows, and it reaches only
# this crate's test targets -- never the library or the inspect binary.
ignis-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }