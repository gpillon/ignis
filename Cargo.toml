[workspace]
resolver = "2"
members = ["crates/*"]
# Patched third-party crates (see each one's IGNIS-PATCH.md): built through
# [patch.crates-io] below, never as workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.3.3"
edition = "2024"
# LICENSE is the verbatim Apache text; the root NOTICE carries the copyright
# and points at kernel/NOTICE for the vendored subtree's own terms (ADR 0010).
license = "Apache-2.0"

# GitHub #135. The GPU profile's f64 layer oracles are CPU-bound on scalar
# `f64` with per-element NVFP4 / W8 dequantization, and at the default
# `opt-level = 0` they dominated the serialized `--ignored` stage. The real
# two-layer oracle (`layer_reference_real`) took 123.94 s there; optimizing
# alone brought it to ~25 s, and with the oracle's rows spread over threads
# it runs in ~3.9 s. The oracle lives in a library crate, so `[profile.test]`
# alone would not reach it -- `cargo test` builds dependencies with `dev`,
# and only the test targets themselves with `test`.
#
# Rust applies no fast-math, so every `f64` result -- and therefore every
# measured tolerance in the profile -- is bit-identical to the unoptimized
# build. `debug-assertions` (and the overflow checks that follow them) stay
# on in both profiles: this buys speed, never fewer checks.
[profile.dev]
opt-level = 2
debug-assertions = true

[profile.test]
opt-level = 2
debug-assertions = true

[workspace.dependencies]
memmap2 = "0.9"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
futures-core = "0.3"
# The OpenAPI surface (GitHub #251, ADR 0036): the document is generated
# from the handler annotations, and `utoipa-axum` registers a route and its
# path entry in the same call, so the two cannot drift. Both are pure Rust.
# The Swagger UI page is *not* `utoipa-swagger-ui`: its `rust-embed` pulls
# `windows-sys` 0.59 into the **host** graph, whose raw-dylib imports need a
# `dlltool` the windows-gnu host toolchain cannot run -- and a host
# dependency is not covered by the MSVC target pin in `.cargo/config.toml`.
# The distribution is vendored instead (`crates/server/assets/swagger-ui`).
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
tower = { version = "0.5", features = ["util"] }
# The HTTP-ingress root span (GitHub #81, ADR 0012): `TraceLayer` on the
# `axum` router, not a hand-rolled span-per-request middleware.
tower-http = { version = "0.6", features = ["trace"] }
http-body-util = "0.1"
# `--api-key auto`: the OS random source for the generated key.
getrandom = "0.3"
# `--expose cloudflare-quick`: a public https://*.trycloudflare.com URL,
# spoken natively (QUIC + capnp-RPC) rather than through a cloudflared child.
cloudflare-quick-tunnel = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
# Target-specific, inherited by members via `workspace = true` under their own
# `[target.'cfg(...)'.dependencies]` sections.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
libc = "0.2"

[patch.crates-io]
# 0.3.1 forwards a chunked response (every streamed axum body: SSE) with its
# chunk framing inside the body and never ends it on a keep-alive socket.
# vendor/cloudflare-quick-tunnel/IGNIS-PATCH.md has the fix; drop this once
# upstream carries it.
cloudflare-quick-tunnel = { path = "vendor/cloudflare-quick-tunnel" }
