[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
memmap2 = "0.9"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
futures-core = "0.3"
tower = { version = "0.5", features = ["util"] }
# The HTTP-ingress root span (GitHub #81, ADR 0012): `TraceLayer` on the
# `axum` router, not a hand-rolled span-per-request middleware.
tower-http = { version = "0.6", features = ["trace"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
# Target-specific, inherited by members via `workspace = true` under their own
# `[target.'cfg(...)'.dependencies]` sections.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
libc = "0.2"