# Hold the ADRs and the findings to their frontmatter and their generated
# indexes (ADR 0081): docs/adr/README.md and docs/findings/README.md are written
# by mk/adr-index.py and mk/findings-index.py, never by hand. This runs what
# `make records-check` runs, each script's selftest and then its check, on a
# push that touches either folder or either script. Python's standard library
# alone: nothing to install.
#
# The ADR check also refuses a change to the text of an ADR that existed
# before the push (--since): a decision that changes is a new ADR, and the old
# one changes only in its frontmatter. Its base is the push's previous tip, a
# new branch's merge base with main, or a pull request's base, so the checkout
# takes the history (commits and trees, no blobs until one is read). No
# concurrency group: a run cancelled by the next push would leave its push's
# range unchecked, and a run takes seconds.
#
# It also runs the selftest of mk/board-status.py, the board-status
# workflow's script (#524), which `make records-check` does not: it is the
# same kind of check, the standard library alone and seconds, and this is the
# workflow that runs on every branch and pull request. The selftest compares
# the script's mapping with the table in docs/agents/issue-tracker.md, so a
# change to either starts it.

name: records

on:
  push:
    branches: ["**"]
    paths:
      - "docs/adr/**"
      - "docs/findings/**"
      - "mk/adr-index.py"
      - "mk/findings-index.py"
      - "mk/board-status.py"
      - "docs/agents/issue-tracker.md"
      - ".github/workflows/records.yml"
  pull_request:
    paths:
      - "docs/adr/**"
      - "docs/findings/**"
      - "mk/adr-index.py"
      - "mk/findings-index.py"
      - "mk/board-status.py"
      - "docs/agents/issue-tracker.md"
      - ".github/workflows/records.yml"

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: The ADR index's selftest
        run: python3 mk/adr-index.py --selftest
      - name: The findings index's selftest
        run: python3 mk/findings-index.py --selftest
      - name: The board status's selftest
        run: python3 mk/board-status.py --selftest
      - name: The ADRs' frontmatter and their index, and no earlier ADR's text changed
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          since="${PR_BASE:-$BEFORE}"
          if [ -z "$since" ] || [ "$since" = 0000000000000000000000000000000000000000 ] ||
              ! git cat-file -e "$since^{commit}" 2>/dev/null; then
              since=auto
          fi
          python3 mk/adr-index.py --check --since "$since"
      - name: The findings' frontmatter and their index
        run: python3 mk/findings-index.py --check
