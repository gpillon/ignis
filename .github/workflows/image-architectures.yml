# The container image for a list of CUDA architectures the release does not
# build (ADR 0107): `80;120a` for the A100 and the A30, whole or as a MIG
# instance, or any list kernel/CMakeLists.txt accepts (it must keep an
# arch-specific Blackwell entry such as `120a`).
#
#   workflow_dispatch   the list and the ref chosen by hand
#   push to image/**    the branch's head, with the default list
#
# Published as ghcr.io/<repo>:archs-<list>-<short sha> and
# ghcr.io/<repo>:archs-<list> (the list's `;` as `-`): never `latest`,
# `develop` or a version, which are the release's (release.yml). The image is
# the release's Containerfile, built the same way; only the list differs, and
# the binaries are held to it by mk/cuda-build-check.sh (`--require`).
# A fork's run builds and publishes nothing (GitHub #495): the job names the
# repository.
name: image-architectures

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "CUDA architectures, a CMake list (keep an arch-specific Blackwell entry such as 120a)"
        required: true
        default: "80;120a"
  push:
    branches: ["image/**"]

concurrency:
  group: image-architectures-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHITECTURES: ${{ github.event.inputs.architectures || '80;120a' }}

jobs:
  image:
    if: github.repository == 'gpillon/ignis'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          for d in /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                   /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                   /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf "$d" &
          done
          wait
          df -h /

      - name: Name the tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          list="${ARCHITECTURES//;/-}"
          if ! [[ "$list" =~ ^[0-9a-z-]+$ ]]; then
            echo "architectures '$ARCHITECTURES' is not a CMake list such as 80;120a" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$image:archs-$list-${GITHUB_SHA::7}"
            echo "$image:archs-$list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the container image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Containerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.description=ignis built for the CUDA architectures ${{ env.ARCHITECTURES }} (ADR 0107)
          cache-from: type=gha,scope=archs-${{ env.ARCHITECTURES }}
          cache-to: type=gha,mode=max,scope=archs-${{ env.ARCHITECTURES }}
          build-args: |
            KERNEL_BUILD_JOBS=3
            CUDA_ARCHITECTURES=${{ env.ARCHITECTURES }}
            CUDA_REQUIRED_ARCHITECTURES=${{ env.ARCHITECTURES }}
