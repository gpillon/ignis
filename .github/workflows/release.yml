# Build ignis for Windows and Linux (x86_64, CUDA/SM120a) and, on a v* tag,
# publish both as a GitHub Release.
#
# A push to main or to a ci/** branch runs the same two builds and publishes
# nothing: that is the dry run for a release, so a tag is only ever cut on a
# pipeline already known to be green.
#
# The container image is NOT built here -- image.yml owns it, so a failure on
# either side never holds the other back. The release waits for both binary
# builds and for neither the image nor anything else.
#
# Both halves build the real GPU engine (`--features cuda`). No runner has an
# NVIDIA GPU, so nothing here is *run* -- the kernel leaf is compiled for
# SM120a and linked against the toolkit's driver stubs (crates/artifact/
# build.rs). Tests stay on the machine with the 5090 (docs/agents/testing.md).

name: release

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# A tag's run is never cancelled: it is the one that publishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CUDA_VERSION: "13.1.1"

jobs:
  # The version the artifacts are named after. On a tag it must be the version
  # the workspace already declares -- a tag that disagrees with Cargo.toml is
  # a release whose `--version` output lies, so it fails here instead.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
          web_version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' web/package.json | head -1)
          echo "Cargo.toml       $cargo_version"
          echo "web/package.json $web_version"
          if [ "$cargo_version" != "$web_version" ]; then
            echo "::error::workspace version ($cargo_version) and web/package.json ($web_version) disagree"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag v$tag_version does not match workspace.package.version $cargo_version"
              exit 1
            fi
            echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          else
            echo "version=${cargo_version}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Linux: built through the Containerfile's `artifacts` stage, which holds
  # exactly the binaries the runtime image runs -- so the tarball and the
  # published image can never carry different builds, and the CUDA toolkit
  # comes from the base image rather than an install step. image.yml shares
  # the build cache through the same scope, so whichever job gets there second
  # mostly reuses it.
  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The nvidia/cuda devel image is ~10 GB unpacked, and the kernel leaf's
      # build directory and cargo's target directory are several more each.
      # None of it fits next to the runner's preinstalled SDKs.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the Linux binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=./out/linux
          # An explicit scope, shared with image.yml: the default is per
          # workflow, which would compile the same kernel twice per push.
          cache-from: type=gha,scope=linux-cuda
          cache-to: type=gha,mode=max,scope=linux-cuda
          # 4 cores, 16 GB: nvcc on the W4A4/TMA units needs more than 2 GB
          # each, so the width is capped below the core count.
          build-args: |
            KERNEL_BUILD_JOBS=3

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="ignis-v${{ needs.version.outputs.version }}-x86_64-unknown-linux-gnu"
          mv out/linux "$name"
          chmod +x "$name"/ignis-server "$name"/ignis-bench "$name"/ignis-artifact-inspect
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ignis-v*-x86_64-unknown-linux-gnu.tar.gz*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Playground
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda-${{ env.CUDA_VERSION }}

      # kernel/build.ps1 needs ninja on PATH (its only fallback is a path on
      # the development machine). The runner image ships it, but an hour-long
      # job should not depend on that staying true.
      - name: Ensure ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      # The full network install rather than a sub-package list: CUDA 13
      # renamed several components, and a wrong name fails the job an hour
      # into it. Narrowing this is an optimisation for once the pipeline is
      # known good.
      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network

      # kernel/build.ps1 is cmake + ninja + nvcc and takes the better part of
      # an hour on a 4-core runner. It rebuilds only what changed, so the
      # build directory is cached on the kernel sources themselves.
      - name: Cache the kernel leaf build
        uses: actions/cache@v4
        with:
          path: kernel/build
          key: kernel-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('kernel/CMakeLists.txt', 'kernel/build.ps1', 'kernel/src/**', 'kernel/include/**', 'kernel/tests/**', 'kernel/vendor/src/**', 'kernel/vendor/include/**') }}
          restore-keys: |
            kernel-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-

      - name: Build
        shell: pwsh
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc `
            --workspace --features ignis-server/cuda

      - name: Package
        shell: bash
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          set -euo pipefail
          name="ignis-v${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc"
          mkdir "$name"
          cp target/x86_64-pc-windows-msvc/release/ignis-server.exe "$name"/
          cp target/x86_64-pc-windows-msvc/release/ignis-bench.exe "$name"/
          cp target/x86_64-pc-windows-msvc/release/ignis-artifact-inspect.exe "$name"/
          # Apache-2.0 asks that a redistribution carry LICENSE and NOTICE;
          # kernel/NOTICE is the vendored ops' own provenance (ADR 0010).
          cp LICENSE NOTICE README.md "$name"/
          cp kernel/NOTICE "$name"/NOTICE-kernel
          # cudart is the one CUDA library the binaries load that does not
          # ship with the driver; NVIDIA lists it as redistributable. The
          # action hands CUDA_PATH out in Windows spelling, which a glob in
          # git bash does not expand.
          cp "$(cygpath -u "$CUDA_PATH")"/bin/cudart64_*.dll "$name"/
          7z a -tzip "$name.zip" "$name" >/dev/null
          sha256sum "$name.zip" | tee "$name.zip.sha256"
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ignis-v*-x86_64-pc-windows-msvc.zip*
          if-no-files-found: error

  # Both hosts, or no release. The image is deliberately not a dependency:
  # it publishes on its own in image.yml, and a registry hiccup there must not
  # withhold the binaries.
  release:
    needs: [version, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## ignis v${{ needs.version.outputs.version }}

            ### Container image (linux/amd64)

            ```
            podman run --rm --device nvidia.com/gpu=all -p 8000:8000 \
              -v /path/to/models:/models:ro \
              -e IGNIS_ARTIFACT=/models/<name>.ninfer \
              ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ```

            (`docker`: `--gpus all` in place of `--device`.) The image carries
            the CUDA runtime but no driver — the host's NVIDIA driver is
            injected by the container runtime. It is published by its own
            workflow, so check the `image` run if the tag above is not there
            yet.

            ### Binaries

            The kernel is compiled for **SM120a** (RTX 5090 / Blackwell
            consumer) only, and the engine needs a `.ninfer` artifact, which
            is not part of this release. The Linux tarball needs the CUDA 13
            runtime on the host; the Windows zip carries `cudart64_*.dll`.
            Both need an NVIDIA driver new enough for CUDA 13.

            Apache-2.0 (`LICENSE`, `NOTICE`); the vendored reference ops keep
            their own terms (`NOTICE-kernel`).
