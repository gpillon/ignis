# Build ignis for Windows and Linux (x86_64, CUDA for compute capability 8.6
# and 12.0), build the linux/amd64 container image, and publish all three: a
# release on a v* tag, a development build on a push to main.
#
#   v*.*.* tag   the release: image tagged <version> + <major>.<minor> +
#                latest, and a GitHub release with the archives.
#   main         a development build, NOT a release (ADR 0032, amended
#                2026-10-07): the image tagged `develop` only, and a rolling
#                GitHub prerelease whose tag `develop` is moved to the run's
#                commit on every run. Never `latest`, never a version tag. A
#                workflow_dispatch run on main publishes the same way.
#   ci/**        the same tests and builds and publishes nothing: the dry run
#                for a release, so a tag is only ever cut on a pipeline
#                already known to be green.
#   a fork       the same tests and builds on any of the above, and nothing
#                published (GitHub #495): every publishing job and step
#                starts its condition with github.repository ==
#                'gpillon/ignis', so a fork that keeps Actions on gets CI on
#                its own changes and no image, release or prerelease under
#                its name labelled as ignis's. A test holds every publishing
#                point to it (crates/server/tests/fork_publishing.rs).
#
# A push to main or ci/** that changes only files no build, image or test
# reads (paths-ignore below: Markdown, docs, bench data, scripts) starts no
# run at all (ADR 0032, amended 2026-10-12). Tags are never path-filtered.
#
# Nothing is published before the tests pass (ADR 0086, which amends ADR
# 0032; GitHub #552). The `test` job runs the CPU-only suite on both hosts --
# `cargo test` never touches the GPU on its own (docs/agents/testing.md),
# which is exactly what makes it runnable on a runner with no card in it. The
# builds run beside it, and every job that publishes (the image, the
# `develop` prerelease, the release) needs it. The GPU profile stays on the
# machine with the 5090.
#
# The Linux tarball and the container image are one job and one compile (ADR
# 0032, revised): the Containerfile's `artifacts` stage holds exactly the
# binaries its `runtime` stage runs, and a second build step in the same job
# hits the builder's own cache rather than compiling the kernel twice. The
# `image` job only pushes the image that job built, after the tests.
#
# Both halves build the real GPU engine (`--features cuda`). No runner has an
# NVIDIA GPU, so nothing here is *run* -- the kernel leaf is compiled for
# `86;120a` (IGNIS_CUDA_ARCHITECTURES below) and links the CUDA runtime only:
# the driver (libcuda/nvcuda) and NVML are opened at run time
# (kernel/src/cuda_driver_shim.cu, shared_library.cu; crates/artifact/build.rs),
# so no driver stub is needed at link time.
#
# Neither half packages a server that is not a CUDA build: both run
# mk/cuda-build-check.sh on it first. v0.9.0 and v0.9.1 shipped the CPU mock
# under a release name, and nothing here noticed (GitHub #408). The same check
# refuses any packaged binary that carries no machine code for 8.6, or none
# for 12.0, whatever list the build was given (#482), and holds the 8.6 code
# of the kernels listed in mk/full-rate-kernels.txt to the full-rate rule, read
# with cuobjdump from the CUDA toolkit (#512).

name: release

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*.*.*"]
    # Nothing here is compiled, embedded, packaged as behaviour or read by a
    # test: no include_str!/include_bytes! names a .md, docs/ or bench/ file,
    # web/ imports none, and scripts/ only drives local runs. tools/ is not
    # here (a test runs tools/flash-next-converter), nor mk/ (the server
    # embeds mk/kv-pool-tokens.sh and this workflow runs mk/version.sh). The
    # archives' README.md catches up on the next code push. One test reads
    # docs/: crates/server/tests/user_docs_reference.rs compares the
    # generated docs/user/reference/ with the code (ADR 0066), and only a
    # code change, which runs this workflow, can make it stale. The guide
    # itself builds in docs.yml.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "bench/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

# A tag's run is never cancelled: it is the one that publishes a release. Main
# runs cancel each other, so `develop` only ever follows the newest push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CUDA_VERSION: "13.1.1"
  # The CUDA architectures the kernel leaf is compiled for on both hosts (#482,
  # ADR 0077): sm_86 machine code, which RTX 30 (Ampere) and RTX 40 (Ada)
  # cards run, and sm_120a, which RTX 50 and RTX PRO (Blackwell) cards run.
  # kernel/CMakeLists.txt reads it; the Windows build and its check read it
  # from here, the Linux build and its check from the Containerfile's
  # CUDA_ARCHITECTURES. A build from a checkout leaves it unset: `120a` alone.
  # The sm_120a cubins are the same bytes as a `120a`-only build's.
  IGNIS_CUDA_ARCHITECTURES: "86;120a"
  # What the release requires of every binary it packages, whatever the list
  # above (spec #474, #482): machine code for 8.6 and for 12.0. It is written
  # apart from that list and passed to mk/cuda-build-check.sh as --require, so
  # an edit that drops an architecture from the builds is refused, not checked
  # against itself. The Windows check reads it from here, the Linux one from
  # the Containerfile's CUDA_REQUIRED_ARCHITECTURES.
  IGNIS_CUDA_REQUIRED_ARCHITECTURES: "86;120a"

jobs:
  # The version the artifacts are named after. On a tag it must be the version
  # the workspace already declares -- a tag that disagrees with Cargo.toml is
  # a release whose `--version` output lies, so it fails here instead.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # What the archives are named after: v<version> for a release, and for
      # anything else a name that cannot be mistaken for one.
      label: ${{ steps.resolve.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      # The version lives in four files, not two, and `mk/version.sh` is the
      # one place that knows which -- the same check `make version-check`
      # runs. It is bash, so it runs here unchanged.
      - name: Every release file declares the same version
        shell: bash
        run: bash mk/version.sh check

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
          echo "Cargo.toml $cargo_version"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag v$tag_version does not match workspace.package.version $cargo_version"
              exit 1
            fi
            echo "version=$tag_version" >> "$GITHUB_OUTPUT"
            echo "label=v$tag_version" >> "$GITHUB_OUTPUT"
          else
            if [ "${GITHUB_REF}" = refs/heads/main ]; then prefix=develop; else prefix=ci; fi
            echo "label=${prefix}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "version=${cargo_version}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # The CPU-only gate, on both hosts, before anything is published. This is
  # `make test-all` without the Makefile: the workspace suite, plus the
  # Playground's typecheck and vitest run.
  #
  # The suite runs as four shards per host (GitHub #552): almost all of a
  # leg's time was compiling, not running (on the Linux runner ~10 of ~12.5
  # minutes, on Windows ~21 of ~25), because every workspace crate and every
  # one of the ~330 test binaries is built again on every push. Each shard is
  # `cargo test --workspace` with the target flags of its part, so it compiles
  # only that part; mk/test-shard.sh reads the parts off `cargo metadata`, and
  # the four together hold every target `cargo test --workspace` runs exactly
  # once (mk/test-shard-selftest.sh, which shard 1 runs, holds the script to
  # that). The count is both the matrix's and the script's argument, and
  # crates/server/tests/ci_pipeline.rs holds the two to each other. The
  # selftests and the Playground's checks run once per host, in shard 1.
  #
  # One rust-cache per host, shared by the shards and saved by shard 1: every
  # shard builds the dependencies of the whole workspace (each holds
  # integration tests of every crate that has several), and one copy of them
  # is ~0.5 GB of the repository's 10 GB Actions cache.
  #
  # No `--features cuda` anywhere here. The default build is pure Rust (the
  # ADR 0006 CPU mock), so no runner needs a CUDA toolkit to run the suite,
  # and every GPU-touching Rust test is `#[ignore]`d behind the GPU profile.
  #
  # fail-fast off: when one host breaks, the other host's result is the
  # information that says whether it is the change or the platform.
  #
  # The target is spelled out per host because `.cargo/config.toml` pins
  # `build.target` to the MSVC triple for every host -- cargo has no host
  # condition for it (ADR 0032, GitHub #226). A bare `cargo test` on Linux
  # therefore asks for a Windows target that is not installed and dies in the
  # first dependency with `can't find crate for 'core'`. Everything else that
  # builds on Linux (the Makefile, the Containerfile) overrides it the same
  # way.
  test:
    strategy:
      fail-fast: false
      matrix:
        host: [linux, windows]
        shard: [1, 2, 3, 4]
        include:
          - host: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
    name: test (${{ matrix.host }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # Line tables only, in place of the profiles' full debuginfo (#552): no
    # one attaches a debugger here, and a panic still names its file and line.
    # The suite compiled and ran the same; measured on these runners (the
    # workspace rebuilt with its dependencies warm, two runs each), the
    # compile went from 843/872 s to 397/483 s on Linux and from 1302 s to
    # 1100/1090 s on Windows, the target from 59 to 19 GB and from 29 to
    # 11 GB.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-cpu-shards
          save-if: ${{ matrix.shard == 1 }}

      # The shard script's own test first: it decides what the shards run.
      - name: Test shard selftest
        if: matrix.shard == 1
        shell: bash
        run: bash mk/test-shard-selftest.sh

      # The independent JSON Schema validator structured output's served
      # answers are checked with (spec #287, tools/grammar-check), on every
      # shard: the tests that need it fail on CI when it is missing, where
      # they skip on a machine without it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the grammar validator
        shell: bash
        run: |
          venv="$RUNNER_TEMP/grammar-venv"
          python -m venv "$venv"
          py="$venv/bin/python"
          [ -x "$py" ] || py="$venv/Scripts/python.exe"
          "$py" -m pip install --quiet --disable-pip-version-check -r tools/grammar-check/requirements.txt
          echo "IGNIS_GRAMMAR_CHECK_PYTHON=$py" >> "$GITHUB_ENV"

      # `web/dist` is deliberately not built first: `crates/server/build.rs`
      # embeds it only when it exists and the server serves its build-me page
      # when it does not, so the suite is green either way (the assertion in
      # crates/server/src/playground.rs covers both states). The Playground's
      # own tests are below.
      - name: cargo test, shard ${{ matrix.shard }} of 4 (CPU only)
        shell: bash
        run: bash mk/test-shard.sh ${{ matrix.shard }} 4 ${{ matrix.target }}

      # The check that decides whether a build below is packaged (GitHub
      # #408), tested on both hosts because both run it.
      - name: CUDA build check selftest
        if: matrix.shard == 1
        shell: bash
        run: bash mk/cuda-build-check-selftest.sh

      # `make doctor`'s CUDA checks on Linux (GitHub #498), on fake roots.
      - name: Linux doctor selftest
        if: matrix.shard == 1
        shell: bash
        run: bash mk/linux/doctor-selftest.sh

      # `make run-ui` / `dev-ui`'s session on Linux (GitHub #226), on a stub
      # server and a stub Vite. Linux only: it needs /proc and process groups.
      - name: Linux dev-ui selftest
        if: matrix.host == 'linux' && matrix.shard == 1
        shell: bash
        run: bash mk/linux/devui-selftest.sh

      # The Playground's logic is pure TypeScript with no host in it, so one
      # run answers for both (ADR 0026, docs/agents/testing.md). Linux is the
      # cheaper runner.
      - uses: actions/setup-node@v4
        if: matrix.host == 'linux' && matrix.shard == 1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Playground typecheck and unit tests
        if: matrix.host == 'linux' && matrix.shard == 1
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run test

  # The workspace compiles on a Mac (GitHub #496): arm64, the hardware a Metal
  # backend would run on (#439). macOS is not a target, so this checks and
  # runs nothing -- libraries, binaries, tests and examples compile without
  # the `cuda` feature -- and it blocks nothing: no job needs it, and
  # continue-on-error keeps a failure here from failing the run, so a `ci/**`
  # dry run stays the signal a tag is cut on. A tag's run skips it, so the
  # `success` docs.yml waits for before it deploys the guide never hangs on
  # it either. It publishes nothing. A test holds it to this shape
  # (crates/server/tests/macos_check_job.rs).
  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-macos

      - name: cargo check (macOS, no CUDA)
        shell: bash
        run: cargo check --workspace --all-targets --locked --target aarch64-apple-darwin

  # Linux binaries and the container image, from one Containerfile and one
  # compile (ADR 0032, revised 2026-09-21). The `artifacts` stage holds
  # exactly the binaries the `runtime` image runs, so the tarball and the
  # published image can never carry different builds, and the CUDA toolkit
  # comes from the base image rather than an install step.
  #
  # The two build steps share the builder this job set up, so the second one
  # is layer hits: the kernel is compiled once per push, which is what the
  # separate image workflow needed a shared remote cache scope to approximate.
  #
  # It runs beside the tests and publishes nothing (ADR 0086, which amends
  # ADR 0032; #552): when the run will publish, the image step writes the
  # image it built to an OCI archive, and the `image` job pushes that archive
  # once the tests have passed. The pushed image is this compile's, as the
  # tarball is.
  linux:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # The nvidia/cuda devel image is ~10 GB unpacked, and the kernel leaf's
      # build directory and cargo's target directory are several more each.
      # None of it fits next to the runner's preinstalled SDKs.
      #
      # Removed in parallel: these are independent trees, and serially they
      # cost 1.7 minutes of a job that takes 2 minutes when the build cache
      # is warm.
      - name: Free disk space
        run: |
          for d in /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                   /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                   /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf "$d" &
          done
          wait
          df -h /

      - uses: docker/setup-buildx-action@v3

      # The labels it generates take the image's description from the
      # repository's, in place of the Containerfile's; the one below names the
      # cards this image's `86;120a` build runs on (#482).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.description=ignis: OpenAI-compatible inference server for Qwen3.8 on NVIDIA RTX 30 and RTX 40 (Ampere, Ada) and RTX 50 and RTX PRO (Blackwell) cards, with the Playground UI

      - name: Build the Linux binaries
        uses: docker/build-push-action@v6
        env:
          # No build-record artifact: nothing reads it here, and an unfiltered
          # download-artifact in the release job chokes on it.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Containerfile
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=./out/linux
          # A SLSA attestation belongs on an image, not loose in a tarball:
          # left on, buildx drops a provenance.json next to the binaries.
          provenance: false
          # An explicit scope. The default is per workflow, which would now be
          # enough on its own, but a named scope survives a workflow rename
          # and keeps the cache addressable from a `ci/**` dry run.
          #
          # Read only: the image step below exports the same `build` stage,
          # and a `mode=max` export of it twice per run is several GB written
          # twice against a repo cache capped at 10. All this step adds on top
          # of what that one exports is the `artifacts` COPY, which is three
          # files out of a layer already in the cache.
          cache-from: type=gha,scope=linux-cuda
          # 4 cores, 16 GB: nvcc on the W4A4/TMA units needs more than 2 GB
          # each, so the width is capped below the core count. The image step
          # below passes the same arguments, or it is a second compile.
          build-args: |
            KERNEL_BUILD_JOBS=3
            CUDA_ARCHITECTURES=${{ env.IGNIS_CUDA_ARCHITECTURES }}
            CUDA_REQUIRED_ARCHITECTURES=${{ env.IGNIS_CUDA_REQUIRED_ARCHITECTURES }}

      # Same context, same build args, same `build` stage -- everything up to
      # the final COPY is already in this builder's local cache, so this step
      # costs the runtime layers and nothing else.
      #
      # "Same context" is load-bearing and was not free: the step above
      # writes its export into `out/linux`, which is *inside* the context, so
      # until `.dockerignore` excluded it this build saw a different
      # `COPY . .`, missed the cache on it, and recompiled the whole
      # workspace — 429 s of a 610 s step on the first run of this pipeline.
      #
      # When the run will publish, the image goes to an OCI archive outside
      # the context, and the `image` job pushes it: an OCI archive keeps the
      # image's index with its provenance attestation, which the registry
      # held when this step pushed itself. Otherwise the image stays in the
      # builder: the dry run checks that it builds.
      #
      # No `tags` here: the archive holds one image per tag it is given, and
      # skopeo refuses an archive that holds more than one ("more than one
      # image in oci, choose an image"; a release has three tags). The
      # `image` job names the tags, from this job's `image-tags` output.
      - name: Build the container image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Containerfile
          target: runtime
          platforms: linux/amd64
          outputs: ${{ github.repository == 'gpillon/ignis' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && format('type=oci,dest={0}/ignis-image.tar', runner.temp) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=linux-cuda
          cache-to: type=gha,mode=max,scope=linux-cuda
          build-args: |
            KERNEL_BUILD_JOBS=3
            CUDA_ARCHITECTURES=${{ env.IGNIS_CUDA_ARCHITECTURES }}
            CUDA_REQUIRED_ARCHITECTURES=${{ env.IGNIS_CUDA_REQUIRED_ARCHITECTURES }}

      # Its own name, not `*-x86_64`: the release jobs download the archives
      # by that pattern. Compressing it again would only cost time, its
      # layers are compressed already.
      - uses: actions/upload-artifact@v4
        if: github.repository == 'gpillon/ignis' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        with:
          name: image-oci
          path: ${{ runner.temp }}/ignis-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="ignis-${{ needs.version.outputs.label }}-x86_64-unknown-linux-gnu"
          mv out/linux "$name"
          chmod +x "$name"/ignis-server "$name"/ignis-bench "$name"/ignis-artifact-inspect
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ignis-*-x86_64-unknown-linux-gnu.tar.gz*
          if-no-files-found: error

  # Beside the tests, like `linux`: it publishes nothing, and what does
  # publish its zip needs `test` (ADR 0086, #552).
  windows:
    needs: [version]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Playground
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda-${{ env.CUDA_VERSION }}

      # kernel/build.ps1 needs ninja on PATH (its only fallback is a path on
      # the development machine). The runner image ships it, but an hour-long
      # job should not depend on that staying true.
      - name: Ensure ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      # Only the components this build touches. The full toolkit took 7.9
      # minutes of a 26-minute job, almost all of it downloading libraries
      # (cuBLAS, cuFFT, Nsight) nothing here links. It is now 0.7:
      #
      #   nvcc       the compiler driver
      #   crt        bin/crt, its link stubs
      #   nvvm       cicc, the device compiler nvcc drives -- a component of
      #              its own on Windows, not part of nvcc
      #   cudart     the runtime: headers (cuda.h among them), cudart.lib,
      #              and the cudart64_*.dll the release zip carries
      #   thrust     CUB/Thrust/libcu++. Still spelled `thrust` in the
      #              installer even though CUDA 13 lays it down under
      #              include/cccl, which is where sampling_device.cuh's
      #              <cub/block/block_merge_sort.cuh> resolves
      #   nvml_dev   nvml.h, for ignis_device_nvml_mem_info (GitHub #210),
      #              which opens nvml.dll at run time (#329), and nvml.lib,
      #              which the kernel's image benches link
      #   nvtx       nvtx3/nvToolsExt.h, which the vendored core/nvtx.h
      #              includes
      #   the rest   the small tools nvcc and CMake's compiler probe shell
      #              out to; together a few MB against cuBLAS's several
      #              hundred
      #
      # The names are NVIDIA's own (the Windows installation guide's
      # component table), because the installer REFUSES an unrecognized one
      # -- `cccl_13.1` took the whole job down with exit 3772776473 in five
      # seconds. It refusing is the good case; the step after this one
      # covers the other one, a name that is valid but was left out.
      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "crt", "nvvm", "cudart", "thrust", "nvml_dev", "nvtx", "nvfatbin", "nvjitlink", "cuobjdump", "nvdisasm", "cuxxfilt", "nvprune"]'

      # What the kernel leaf and the Rust link actually open. Not a sample:
      # every toolkit header the tree includes, which is the whole set
      #
      #   grep -rhoE '#include <[A-Za-z0-9_/]+\.(h|cuh)>' kernel/ | sort -u
      #
      # finds that resolves inside CUDA, plus the tools and import libs. A
      # component left out would otherwise surface as a confusing nvcc error
      # ten minutes into the build -- which is how `nvtx` was found -- or,
      # worse, as a zip with no cudart in it.
      - name: Check the toolkit has what the build needs
        shell: bash
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          set -euo pipefail
          cuda="$(cygpath -u "$CUDA_PATH")"
          missing=0
          for f in bin/nvcc.exe bin/crt/link.stub nvvm/bin/cicc.exe \
                   include/cuda.h include/cuda_runtime.h include/cuda_runtime_api.h \
                   include/cuda_bf16.h include/cuda_fp16.h include/cuda_fp4.h \
                   include/cuda_fp8.h include/cuda_pipeline.h \
                   include/cooperative_groups.h include/math_constants.h \
                   include/nvml.h include/nvtx3/nvToolsExt.h include/cudaTypedefs.h \
                   include/cccl/cub/block/block_merge_sort.cuh \
                   lib/x64/cudart.lib lib/x64/nvml.lib; do
            if [ -e "$cuda/$f" ]; then echo "  ok      $f"; else echo "  MISSING $f"; missing=1; fi
          done
          # The redistributable the zip carries; its name follows the major.
          if ls "$cuda"/bin/x64/cudart64_*.dll >/dev/null 2>&1; then
            echo "  ok      bin/x64/cudart64_*.dll"
          else
            echo "  MISSING bin/x64/cudart64_*.dll"; missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::the CUDA sub-package list is missing a component the build needs"
            exit 1
          fi
          "$cuda/bin/nvcc.exe" --version | tail -2

      # kernel/build.ps1 is cmake + ninja + nvcc: 274 commands and ~12.5
      # minutes on this runner for the `86;120a` archives. The build directory
      # is cached under the kernel sources' own hash, and on the architectures
      # and the toolkit, so a push that changes none of them finds it.
      #
      # ninja decides by date, and the checkout dates every source at the
      # moment it ran, later than the cached objects: restored as is, the
      # directory was compiled again in full on every push (measured on the
      # runner, #552: "output ... older than most recent input" for all 274).
      # On an exact hit the sources are byte for byte the ones the cached
      # objects were built from, so the step after this one dates them back
      # and ninja finds the leaf current. There is no partial restore
      # (restore-keys): there, sources dated back would hide the changed ones
      # and link the old objects, the staleness crates/artifact/build.rs exists
      # to prevent (GitHub #94). A kernel change compiles the leaf from
      # nothing, as every push did before.
      - name: Cache the kernel leaf build
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: kernel/build
          key: kernel-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ env.IGNIS_CUDA_ARCHITECTURES }}-${{ hashFiles('kernel/CMakeLists.txt', 'kernel/build.ps1', 'kernel/src/**', 'kernel/include/**', 'kernel/tests/**', 'kernel/vendor/src/**', 'kernel/vendor/include/**') }}

      # Exactly the files the key hashes: anything else keeps the checkout's
      # date, so a file that should have been in the key costs a rebuild,
      # never a stale object.
      - name: Date the kernel sources back to the cached build's
        if: steps.kernel-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          touch -d '2000-01-01' kernel/CMakeLists.txt kernel/build.ps1
          find kernel/src kernel/include kernel/tests kernel/vendor/src kernel/vendor/include \
            -type f -exec touch -d '2000-01-01' {} +

      # `--features cuda`, never `ignis-server/cuda`: the Containerfile's
      # build stage says why (GitHub #408).
      - name: Build
        shell: pwsh
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc `
            --workspace --features cuda

      - name: Package
        shell: bash
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          set -euo pipefail
          name="ignis-${{ needs.version.outputs.label }}-x86_64-pc-windows-msvc"
          mkdir "$name"
          cp target/x86_64-pc-windows-msvc/release/ignis-server.exe "$name"/
          cp target/x86_64-pc-windows-msvc/release/ignis-bench.exe "$name"/
          cp target/x86_64-pc-windows-msvc/release/ignis-artifact-inspect.exe "$name"/
          # A server that would fall back to the CPU mock is not packaged
          # (GitHub #408), nor a binary without machine code for every entry
          # of IGNIS_CUDA_ARCHITECTURES and of the release's requirement
          # (#482); the Linux build runs the same check in the Containerfile.
          bash mk/cuda-build-check.sh --require "$IGNIS_CUDA_REQUIRED_ARCHITECTURES" "$name"/ignis-server.exe "$name"/ignis-bench.exe "$name"/ignis-artifact-inspect.exe
          # Apache-2.0 asks that a redistribution carry LICENSE and NOTICE;
          # kernel/NOTICE is the vendored ops' own provenance (ADR 0010).
          cp LICENSE NOTICE README.md "$name"/
          cp kernel/NOTICE "$name"/NOTICE-kernel
          # cudart is the one CUDA library the binaries load that does not
          # ship with the driver; NVIDIA lists it as redistributable. CUDA 13
          # keeps it under bin/x64, 12 kept it directly under bin, and
          # CUDA_PATH arrives in Windows spelling, which git bash will not
          # glob. A missing DLL is a zip that does not run, so say so here
          # rather than ship one.
          #
          # A bash glob, not `ls`: an unmatched glob makes ls exit 2, and
          # under `set -e` that kills the step before the check below can
          # report anything -- which is exactly how this failed once, with no
          # output at all. An unmatched glob simply stays literal here, and
          # `-f` rejects it.
          cuda="$(cygpath -u "$CUDA_PATH")"
          dll=""
          for candidate in "$cuda"/bin/x64/cudart64_*.dll "$cuda"/bin/cudart64_*.dll; do
            if [ -f "$candidate" ]; then dll="$candidate"; break; fi
          done
          if [ -z "$dll" ]; then
            echo "::error::no cudart64_*.dll under $cuda/bin or $cuda/bin/x64"
            find "$cuda" -name 'cudart64*' -o -name '*.dll' | head -40
            exit 1
          fi
          echo "cudart: $dll"
          cp "$dll" "$name"/
          7z a -tzip "$name.zip" "$name" >/dev/null
          sha256sum "$name.zip" | tee "$name.zip.sha256"
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ignis-*-x86_64-pc-windows-msvc.zip*
          if-no-files-found: error

  # The image the `linux` job built, pushed once the tests have passed (ADR
  # 0032, amended 2026-11-08, #552): the OCI archive that job wrote, copied to
  # each tag docker/metadata-action gave it there, index and provenance
  # attestation included (`--all`), with its digests unchanged. A `v*` tag
  # pushes <version>, <major>.<minor> and latest, main pushes `develop`.
  image:
    needs: [version, test, linux]
    if: github.repository == 'gpillon/ignis' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-oci
          path: ${{ runner.temp }}/image

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        shell: bash
        env:
          TAGS: ${{ needs.linux.outputs.image-tags }}
        run: |
          set -euo pipefail
          archive="${{ runner.temp }}/image/ignis-image.tar"
          pushed=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
              "oci-archive:$archive" "docker://$tag"
            pushed=$((pushed + 1))
          done <<< "$TAGS"
          if [ "$pushed" = 0 ]; then
            echo "::error::the linux job named no image tag to push"
            exit 1
          fi
          {
            echo "### Image published"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Both hosts, or no release; and the tests (ADR 0086).
  release:
    needs: [version, test, linux, windows]
    if: github.repository == 'gpillon/ignis' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By name, not "everything this run produced": docker/build-push-action
      # uploads a build record of its own (`<owner>~<repo>~XXXXXX.dockerbuild`),
      # an unfiltered download tries to fetch that too, and when it cannot the
      # whole step fails after five retries -- with both real archives already
      # on disk. That is what withheld the v0.1.0 release while the image was
      # already published. DOCKER_BUILD_RECORD_UPLOAD on the build steps stops
      # it being created; this pattern means it would not matter if it were.
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-x86_64"
          merge-multiple: true
          path: dist

      - name: What will be released
        run: ls -l dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # This only ever adds the compare link: it lists merged PRs and this
          # repo merges locally. What a release changed is written by hand
          # into the body below, from the draft `make changelog` prints (it is
          # the last thing `make version-bump` tells you to run).
          generate_release_notes: true
          body: |
            ## ignis v${{ needs.version.outputs.version }}

            ### Container image (linux/amd64)

            ```
            podman run --rm --device nvidia.com/gpu=all -p 8000:8000 \
              -v /path/to/models:/models:ro \
              -e IGNIS_MODEL_ARTIFACT=/models/<name>.ninfer \
              ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ```

            (`docker`: `--gpus all` in place of `--device`.) The image carries
            the CUDA runtime but no driver — the host's NVIDIA driver is
            injected by the container runtime. It is built from the same
            compile as the Linux tarball below, so the two always carry the
            same binaries.

            ### Binaries

            The kernel is compiled for compute capability 8.6 and 12.0
            (`86;120a`), so the same binaries run on:

            - RTX 30 cards (Ampere): the RTX 3090 and 3090 Ti are supported,
              on the 27B's 16 GB entries;
            - RTX 40 cards (Ada), on the 8.6 code: the RTX 4090 and the 16 GB
              cards are verified for correctness, and reports are welcome;
            - RTX 50 and RTX PRO 6000 cards (Blackwell).

            The NVFP4 27B, Flash-Next and the image model load on Blackwell
            alone. The engine needs a `.ninfer` artifact, which is not part of
            this release. The Linux tarball needs the CUDA 13
            runtime on the host; the Windows zip carries `cudart64_*.dll`.
            Both need an NVIDIA driver new enough for CUDA 13.

            Apache-2.0 (`LICENSE`, `NOTICE`); the vendored reference ops keep
            their own terms (`NOTICE-kernel`).

  # The rolling development build. One prerelease, tag `develop`, moved to the
  # commit of the newest main run: delete the old release and its tag, then
  # create both again at this commit. Simpler than force-moving a tag under a
  # release that keeps its old assets, and the result cannot mix two runs'
  # files.
  #
  # The window is the few seconds between the two `gh` calls, plus the asset
  # upload. A run cancelled there (the concurrency group cancels main runs)
  # leaves no `develop` release, or one with some assets missing, until the
  # next main run recreates it; nothing else reads it. A tag pushed with
  # GITHUB_TOKEN starts no workflow, and `develop` does not match `v*.*.*`
  # anyway, so this cannot retrigger the pipeline.
  #
  # `--latest=false` and `--prerelease`: this is never the repository's
  # "latest" release, which stays the newest v* tag.
  prerelease:
    needs: [version, test, linux, windows]
    if: github.repository == 'gpillon/ignis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-x86_64"
          merge-multiple: true
          path: dist

      - name: What will be published
        run: ls -l dist

      - name: Move the develop prerelease to this commit
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## ignis development build

          Commit `__SHA__` on `main`. **This is a development build, not a
          release**: it is rebuilt on every push to `main`, replaces the
          previous one, and has had no release checks. Releases are the `v*`
          tags.

          ### Container image (linux/amd64)

          ```
          podman run --rm --device nvidia.com/gpu=all -p 8000:8000 \
            -v /path/to/models:/models:ro \
            -e IGNIS_MODEL_ARTIFACT=/models/<name>.ninfer \
            ghcr.io/__REPO__:develop
          ```

          (`docker`: `--gpus all` in place of `--device`.) The archives below
          come from the same build, compiled for RTX 30 and RTX 40 (Ampere,
          Ada) and RTX 50 and RTX PRO (Blackwell) cards.
          EOF
          sed -i "s|__SHA__|${GITHUB_SHA}|; s|__REPO__|${GITHUB_REPOSITORY}|" notes.md
          gh release delete develop --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          # A `develop` tag left without its release (made by hand, or a run
          # cut short) would win over --target below: drop it too.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/develop" > /dev/null 2>&1 || true
          gh release create develop dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "develop (${GITHUB_SHA::7})" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
