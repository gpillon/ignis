# Build the user guide -- docs/site over the pages in docs/user (ADR 0066) --
# and publish it to GitHub Pages at https://gpillon.github.io/ignis/.
#
#   push / pull_request   the site's tests and build run (a dead link fails
#                         the build); nothing is published.
#   a release published   the release workflow's run for a v*.*.* tag ends
#                         and its GitHub release exists: the tag is built and
#                         deployed, so the published guide describes the
#                         released binary, its links out of docs/user point
#                         at the tag, and its Changelog section (read from the
#                         GitHub releases at build time) carries the release.
#   a release edited      the notes written by hand after publishing: the
#                         newest release's tag is built and deployed again.
#   workflow_dispatch     built and deployed from the chosen ref: a fix
#                         between releases.
#
# Only the newest v*.*.* release is ever deployed: a re-run or an edit of an
# older one builds and stops. A tag push alone builds nothing here: the
# release run it starts is what deploys. docs/user/reference/ is generated
# from the code and held equal to it by `cargo test`
# (crates/server/tests/user_docs_reference.rs), which the release workflow
# runs on every code push; this workflow builds what is committed.
#
# A fork builds and never deploys (GitHub #495): the upload and the
# deployment start their conditions with github.repository ==
# 'gpillon/ignis', which crates/server/tests/fork_publishing.rs holds them
# to.

name: docs

on:
  push:
    branches: ["**"]
    paths:
      - "docs/user/**"
      - "docs/site/**"
      - "web/src/brand/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/user/**"
      - "docs/site/**"
      - "web/src/brand/**"
      - ".github/workflows/docs.yml"
  # The release workflow publishes the release with GITHUB_TOKEN, whose
  # `release: published` starts no workflow; its run ending does.
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never one cancelled half-way. Builds that
# publish nothing cancel each other per ref; a release run on a branch, which
# publishes no release, is a run of its own that skips at once.
concurrency:
  group: >-
    docs-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    || (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v')))
    && 'deploy' || (github.event_name == 'workflow_run' && github.run_id || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release run's tag commit; every other event checks out its own ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          # Each page's "last updated" date is its file's last commit, and the
          # newest release is read from the tags.
          fetch-depth: 0
      - name: What is built, and whether it is published
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # A release tag is vX.Y.Z; a -rc tag would sort above its release.
          newest=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          case "$EVENT" in
            workflow_run) tag=$RUN_TAG; deploy=$([ "$tag" = "$newest" ] && echo true || echo false) ;;
            release) tag=$RELEASE_TAG; deploy=$([ "$PRERELEASE" != true ] && [ "$tag" = "$newest" ] && echo true || echo false) ;;
            workflow_dispatch) tag=$REF_TAG; deploy=true ;;
            *) tag=$REF_TAG; deploy=false ;;
          esac
          echo "ref=${tag:-main}" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Links out of the guide at ${tag:-main}; newest release $newest; deploy: $deploy"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install
        working-directory: docs/site
        run: npm ci
      - name: Test the site's plugins
        working-directory: docs/site
        run: npm test
      - name: Build
        working-directory: docs/site
        env:
          DOCS_GITHUB_REF: ${{ steps.target.outputs.ref }}
          # The Changelog section reads the releases through the API.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Upload the site
        if: github.repository == 'gpillon/ignis' && steps.target.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    needs: build
    if: github.repository == 'gpillon/ignis' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
